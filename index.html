<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Month Word Memory Game</title><style>body{font-family:Arial,sans-serif;margin:0;padding:20px;background:#eef6ff;color:#203040}main{max-width:850px;margin:auto;background:white;border-radius:24px;padding:24px;box-shadow:0 8px 24px #0002}h1{text-align:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button,button{font-size:18px;padding:13px 18px;border:0;border-radius:14px;background:#2563eb;color:white;min-height:48px}.tabs button.active{background:#e83e8c}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.card{background:#f7fbff;color:#203040;border:3px solid #cde2f5}.card.selected{border-color:#e83e8c;background:#fff0f7}.msg{text-align:center;min-height:28px;margin:16px 0;font-size:19px;font-weight:bold}.center{text-align:center}.big{font-size:72px}.input{font-size:24px;padding:12px;width:220px;text-align:center;border:3px solid #b8d6f2;border-radius:12px}@media(max-width:600px){main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:28px}}</style></head><body><main><h1>Month Word Memory Game</h1><p class="center">Listen, say, remember and spell together!</p><p class="center">Score: <b id="score">0</b></p><nav class="tabs"><button class="active" data-tab="match">Match</button><button data-tab="missing">Missing Letter</button><button data-tab="spell">Spelling Quiz</button></nav><section id="match"><h2>Match the month</h2><p>Tap a card to hear the pronunciation, then find its pair.</p><div id="grid" class="cards"></div><div id="matchMsg" class="msg">Choose a card.</div><div class="center"><button id="reset">New round</button> <button id="speakMatch">Listen</button></div></section><section id="missing" hidden><h2>Missing Letter</h2><p>Listen, then type the missing letter.</p><div id="missingBox" class="center"></div><div id="missingMsg" class="msg"></div><div class="center"><button id="checkMissing">Check</button> <button id="newMissing">New question</button> <button id="speakMissing">Listen</button></div></section><section id="spell" hidden><h2>Spelling Quiz</h2><div id="spellEmoji" class="big center">📅</div><p id="hint" class="center"></p><div class="center"><button id="speakSpell">Listen</button><p><input id="answer" class="input" placeholder="Type the month"></p><button id="checkSpell">Check</button> <button id="newSpell">New question</button></div><div id="spellMsg" class="msg"></div></section></main><script>const months=['January','February','March','April','May','June','July','August','September','October','November','December'];let score=0,pick=null,missing,missingAt,spell;const $=x=>document.getElementById(x),shuffle=a=>[...a].sort(()=>Math.random()-.5);function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.volume=1;u.rate=.8;u.lang='en-US';speechSynthesis.speak(u)}function add(n){score+=n;$("score").textContent=score}function render(){$('grid').innerHTML=shuffle(months.flatMap((m,i)=>[{m,i,t:0},{m,i,t:1}])).map(x=>'<button class="card" data-i="'+x.i+'" data-t="'+x.t+'">'+(x.t?x.m:'📅')+'</button>').join('');document.querySelectorAll('.card').forEach(c=>c.onclick=match)}function match(e){let c=e.currentTarget;if(c.disabled)return;say(months[c.dataset.i]);if(!pick){pick=c;c.classList.add('selected');return}c.classList.add('selected');if(c.dataset.i===pick.dataset.i&&c.dataset.t!==pick.dataset.t){c.disabled=pick.disabled=true;add(2);$('matchMsg').textContent='Great match! '+months[c.dataset.i];pick=null}else{setTimeout(()=>{c.classList.remove('selected');pick.classList.remove('selected');pick=null},500);$('matchMsg').textContent='Try again!'}}function newMissing(){missing=months[Math.floor(Math.random()*12)];missingAt=Math.floor(Math.random()*missing.length);let a=missing.split('');a[missingAt]='_';$('missingBox').innerHTML='<div class="big">📅</div><h2>'+a.join('')+'</h2><p>'+ (missingAt+1)+' letter is missing</p><input id="missingInput" class="input" maxlength="1">';$('missingMsg').textContent='';say(missing)}function checkMissing(){if($('missingInput').value.toLowerCase()===missing[missingAt].toLowerCase()){add(2);$('missingMsg').textContent='Correct! '+missing;say(missing)}else $('missingMsg').textContent='Try again!'}function newSpell(){spell=months[Math.floor(Math.random()*12)];$('hint').textContent='Hint: '+(months.indexOf(spell)+1)+' month';$('answer').value='';$('spellMsg').textContent='';say(spell)}function checkSpell(){if($('answer').value.trim().toLowerCase()===spell.toLowerCase()){add(3);$('spellMsg').textContent='Excellent! '+spell;say('Excellent '+spell)}else $('spellMsg').textContent='Try again. The first letter is '+spell[0]}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['match','missing','spell'].forEach(x=>$(x).hidden=x!==b.dataset.tab)});$('reset').onclick=()=>{pick=null;render()};$('speakMatch').onclick=()=>pick&&say(months[pick.dataset.i]);$('newMissing').onclick=newMissing;$('checkMissing').onclick=checkMissing;$('speakMissing').onclick=()=>say(missing);$('newSpell').onclick=newSpell;$('checkSpell').onclick=checkSpell;$('speakSpell').onclick=()=>say(spell);render();newMissing();newSpell();</script></body></html>
