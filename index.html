<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>親子英文月份記憶遊戲</title><style>body{font:18px Arial,"Microsoft JhengHei";margin:0;padding:20px;background:#eef6ff}main{max-width:850px;margin:auto;background:white;padding:24px;border-radius:24px}button{font-size:18px;padding:12px;margin:4px;border:0;border-radius:12px;background:#2563eb;color:white;min-height:48px}.active{background:#e83e8c}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#f5faff;color:#123;border:3px solid #cde2f5}.sel{border-color:#e83e8c}.icon{font-size:34px;display:block}.center{text-align:center}.msg{text-align:center;font-weight:bold;min-height:28px}.big{font-size:70px}.input{font-size:24px;padding:10px;width:220px;text-align:center}</style><main><h1>📅 親子英文月份記憶遊戲</h1><p class="center">一起聽發音、認單字、玩記憶遊戲！<br>目前得分：<b id="score">0</b></p><nav><button class="active" data-t="m">🎯 配對遊戲</button><button data-t="l">🔤 消失的字母</button><button data-t="s">✏️ 拼字挑戰</button></nav><section id="m"><h2>英文與月份配對</h2><p>點圖示或英文卡會播放發音，再找出相同月份。</p><div id="grid" class="cards"><button class="card"><span class="icon">❄️</span>一月 January</button><button class="card"><span class="icon">💕</span>二月 February</button><button class="card"><span class="icon">🌱</span>三月 March</button><button class="card"><span class="icon">🌷</span>四月 April</button><button class="card"><span class="icon">🌼</span>五月 May</button><button class="card"><span class="icon">☀️</span>六月 June</button><button class="card"><span class="icon">🏖️</span>七月 July</button><button class="card"><span class="icon">🍉</span>八月 August</button><button class="card"><span class="icon">🎒</span>九月 September</button><button class="card"><span class="icon">🎃</span>十月 October</button><button class="card"><span class="icon">🍁</span>十一月 November</button><button class="card"><span class="icon">🎄</span>十二月 December</button></div><div id="mm" class="msg"></div><button id="r">重新洗牌</button> <button id="pm">🔊 聽發音</button></section><section id="l" hidden><h2>消失的字母</h2><div id="box" class="center"></div><div id="lm" class="msg"></div><button id="lc">檢查答案</button> <button id="ln">下一題</button> <button id="pl">🔊 聽發音</button></section><section id="s" hidden><h2>拼字挑戰</h2><div id="si" class="big center">📅</div><p id="hint" class="center"></p><div class="center"><button id="ps">🔊 播放發音</button><p><input id="ans" class="input"></p><button id="sc">檢查答案</button> <button id="sn">下一題</button></div><div id="sm" class="msg"></div></section></main><script>let A=[['January','一月','❄️'],['February','二月','💕'],['March','三月','🌱'],['April','四月','🌷'],['May','五月','🌼'],['June','六月','☀️'],['July','七月','🏖️'],['August','八月','🍉'],['September','九月','🎒'],['October','十月','🎃'],['November','十一月','🍁'],['December','十二月','🎄']],S=0,P=null,I,J,K;const $=x=>document.getElementById(x),say=x=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang='en-US';u.volume=1;u.rate=.8;speechSynthesis.speak(u)},sh=x=>[...x].sort(()=>Math.random()-.5);function render(){P=null;grid.innerHTML=sh(A.flatMap((x,i)=>[{i,t:0},{i,t:1}])).map(x=>'<button class="card" data-i="'+x.i+'" data-t="'+x.t+'"><span class="icon">'+A[x.i][2]+'</span>'+(x.t?A[x.i][0]:A[x.i][1])+'</button>').join('');document.querySelectorAll('.card').forEach(x=>x.onclick=e=>{let c=e.currentTarget;say(A[c.dataset.i][0]);if(!P){P=c;c.classList.add('sel')}else if(c.dataset.i==P.dataset.i&&c.dataset.t!=P.dataset.t){c.disabled=P.disabled=true;score.textContent=++S;mm.textContent='🎉 配對成功！';P=null}else{c.classList.remove('sel');P.classList.remove('sel');P=null}})}function nl(){I=Math.random()*12|0;J=Math.random()*A[I][0].length|0;let x=A[I][0].split('');x[J]='_';box.innerHTML='<div class="big">'+A[I][2]+'</div><h2>'+x.join('')+'</h2><p>'+A[I][1]+'</p><input id="in" class="input">';say(A[I][0])}function ns(){K=Math.random()*12|0;si.textContent=A[K][2];hint.textContent='提示：'+A[K][1];ans.value='';say(A[K][0])}document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['m','l','s'].forEach(x=>$(x).hidden=x!=b.dataset.t)});r.onclick=render;pm.onclick=()=>P&&say(A[P.dataset.i][0]);ln.onclick=nl;lc.onclick=()=>lm.textContent=document.getElementById('in').value.toLowerCase()==A[I][0][J].toLowerCase()?'🎉 答對了！':'再試一次';pl.onclick=()=>say(A[I][0]);sn.onclick=ns;sc.onclick=()=>sm.textContent=ans.value.toLowerCase()==A[K][0].toLowerCase()?'🌟 答對了！':'再試一次';ps.onclick=()=>say(A[K][0]);render();nl();ns();</script>
<script>var grid=document.getElementById('grid'),mm=document.getElementById('mm'),score=document.getElementById('score'),box=document.getElementById('box'),lm=document.getElementById('lm'),si=document.getElementById('si'),hint=document.getElementById('hint'),ans=document.getElementById('ans'),sm=document.getElementById('sm');render();nl();ns();</script>
