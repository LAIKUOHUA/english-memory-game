<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>親子英文單字記憶遊戲</title><style>
:root{--blue:#2563eb;--pink:#ec4899;--ink:#17324d;--bg:#eef7ff}*{box-sizing:border-box}body{margin:0;padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));font:18px Arial,"Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:24px;box-shadow:0 8px 24px #9bb8d644}h1{text-align:center;font-size:clamp(25px,5vw,38px);margin:4px 0 10px}h2{font-size:clamp(22px,4vw,30px)}button,input{font:inherit}button{min-height:48px;border:0;border-radius:14px;padding:11px 16px;margin:4px;background:var(--blue);color:white;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}nav{display:flex;flex-wrap:wrap;justify-content:center;margin:12px 0}nav button{background:#64748b}nav button.active{background:var(--pink)}.center{text-align:center}.score{font-size:22px;font-weight:bold;color:#be185d}.game{display:none}.game.active{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#f8fbff;color:var(--ink);border:3px solid #c6def2;min-height:100px}.card .icon{display:block;font-size:42px}.card.selected{border-color:var(--pink);background:#fff0f8}.card.matched{border-color:#22c55e;background:#ecfdf5}.msg{text-align:center;min-height:32px;font-weight:bold;color:#be185d;margin:8px}.big{font-size:58px;text-align:center}.challenge{text-align:center;background:#f8fbff;border-radius:18px;padding:18px}.input{font-size:24px;padding:10px;border:3px solid #b8cee4;border-radius:12px;width:min(100%,300px);text-align:center}.hint{letter-spacing:5px;font-size:28px;font-weight:bold}.help{color:#526b82}.wide{display:block;margin:10px auto}@media(max-width:560px){main{padding:15px;border-radius:18px}.cards{grid-template-columns:repeat(2,1fr)}button{padding:10px 12px}.card{min-height:94px}}
</style></head><body><main><h1>🧤 親子英文單字記憶遊戲</h1><p class="center">一起聽發音、認單字、玩記憶遊戲！<br>目前得分：<span class="score" id="score">0</span></p><nav><button class="active" data-game="match">🎯 配對遊戲</button><button data-game="missing">🔤 消失的字母</button><button data-game="spelling">✏️ 拼字挑戰</button></nav>
<section id="match" class="game active"><h2>英文與圖像／中文意思配對</h2><p class="help">點圖示或英文卡會播放發音，再找出相同單字。</p><div id="matchGrid" class="cards"></div><p id="matchMsg" class="msg"></p><button id="matchListen" class="wide">🔊 聽單字</button><button id="matchReset" class="wide">🔄 重新洗牌</button></section>
<section id="missing" class="game"><h2>消失的字母</h2><p class="help">看圖和提示，填入消失的 1 個字母，再按檢查。</p><div class="challenge"><div id="missingIcon" class="big"></div><p id="missingMeaning"></p><p id="missingPattern" class="hint"></p><button id="missingListen">🔊 聽發音</button><br><input id="missingInput" class="input" maxlength="1" autocomplete="off" aria-label="輸入消失的字母"><button id="missingCheck">檢查答案</button><p id="missingMsg" class="msg"></p><button id="missingNext">下一題 ➜</button></div></section>
<section id="spelling" class="game"><h2>拼字挑戰</h2><p class="help">看圖和中文意思，輸入完整英文單字。</p><div class="challenge"><div id="spellingIcon" class="big"></div><p id="spellingMeaning"></p><button id="spellingListen">🔊 播放發音</button><br><input id="spellingInput" class="input" autocomplete="off" aria-label="輸入英文單字"><button id="spellingCheck">檢查答案</button><p id="spellingMsg" class="msg"></p><button id="spellingNext">下一題 ➜</button></div></section></main>
<script>
const words=[{word:'boot',meaning:'靴子',icon:'🥾'},{word:'mitten',meaning:'連指手套',icon:'🧤'},{word:'sweater',meaning:'毛衣',icon:'🧶'},{word:'swimsuit',meaning:'泳衣',icon:'🩱'},{word:'coat',meaning:'外套',icon:'🧥'},{word:'scarf',meaning:'圍巾',icon:'🧣'}];let score=0;let selected=null;let matched=0;let missingItem;let missingIndex;let spellingItem;
const $=id=>document.getElementById(id);function say(text){if(!('speechSynthesis'in window)){return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.volume=1;u.rate=.78;speechSynthesis.speak(u)}function addScore(n){score+=n;$('score').textContent=score}
function renderMatch(){const cards=[];words.forEach(x=>cards.push({...x,type:'pic'}));words.forEach(x=>cards.push({...x,type:'word'}));cards.sort(()=>Math.random()-.5);$('matchGrid').innerHTML=cards.map((x,i)=>'<button class="card" data-index="'+i+'" data-word="'+x.word+'"><span class="icon">'+(x.type==='pic'?x.icon:'🔤')+'</span>'+(x.type==='pic'?x.meaning:x.word)+'</button>').join('');selected=null;matched=0;$('matchMsg').textContent='';document.querySelectorAll('#matchGrid .card').forEach(c=>c.addEventListener('click',()=>{say(c.dataset.word);if(c.classList.contains('matched'))return;if(!selected){selected=c;c.classList.add('selected');return}if(selected===c)return;if(selected.dataset.word===c.dataset.word&&selected.querySelector('.icon').textContent!==c.querySelector('.icon').textContent){selected.classList.remove('selected');selected.classList.add('matched');c.classList.add('matched');matched++;addScore(1);$('matchMsg').textContent=matched===words.length?'🎉 全部配對成功！太棒了！':'✅ 配對成功！';selected=null}else{c.classList.add('selected');$('matchMsg').textContent='再想一下，找相同的單字！';setTimeout(()=>{c.classList.remove('selected');if(selected){selected.classList.remove('selected');selected=null}},500)}}))}
function newMissing(){missingItem=words[Math.floor(Math.random()*words.length)];missingIndex=Math.floor(Math.random()*missingItem.word.length);$('missingIcon').textContent=missingItem.icon;$('missingMeaning').textContent=missingItem.meaning+'（'+missingItem.word+'）';$('missingPattern').textContent=missingItem.word.split('').map((c,i)=>i===missingIndex?'_':c).join(' ');$('missingInput').value='';$('missingMsg').textContent='';say(missingItem.word)}function checkMissing(){const value=$('missingInput').value.toLowerCase();if(value===missingItem.word[missingIndex]){addScore(1);$('missingMsg').textContent='🎉 答對了！ '+missingItem.word;say(missingItem.word)}else{$('missingMsg').textContent='💪 再試一次，聽聽發音！';say(missingItem.word)}}
function newSpelling(){spellingItem=words[Math.floor(Math.random()*words.length)];$('spellingIcon').textContent=spellingItem.icon;$('spellingMeaning').textContent=spellingItem.meaning;$('spellingInput').value='';$('spellingMsg').textContent='';say(spellingItem.word)}function checkSpelling(){const value=$('spellingInput').value.trim().toLowerCase();if(value===spellingItem.word){addScore(1);$('spellingMsg').textContent='🌟 太棒了！ '+spellingItem.word;say('Great job! '+spellingItem.word)}else{$('spellingMsg').textContent='💪 再試一次！可以按播放發音。';say(spellingItem.word)}}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));$(b.dataset.game).classList.add('active')}));$('matchListen').onclick=()=>say(selected?selected.dataset.word:'boot');$('matchReset').onclick=renderMatch;$('missingListen').onclick=()=>say(missingItem.word);$('missingCheck').onclick=checkMissing;$('missingNext').onclick=newMissing;$('spellingListen').onclick=()=>say(spellingItem.word);$('spellingCheck').onclick=checkSpelling;$('spellingNext').onclick=newSpelling;$('missingInput').onkeydown=e=>{if(e.key==='Enter')checkMissing()};$('spellingInput').onkeydown=e=>{if(e.key==='Enter')checkSpelling()};renderMatch();newMissing();newSpelling();
</script></body></html>
